---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "dexgate.fullname" . }}
  namespace: {{ .Release.Namespace  }}
  labels:
    app: {{ include "dexgate.fullname" . }}
  annotations:
    configmap.reloader.stakater.com/reload: "{{ include "dexgate.fullname" . }}-config"
spec:
  replicas: 1
  selector:
    matchLabels:
      app: {{ include "dexgate.fullname" . }}
  template:
    metadata:
      labels:
        app: {{ include "dexgate.fullname" . }}
    spec:
      serviceAccountName: {{ include "dexgate.fullname" . }}
      {{- with .Values.image.pullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.podSecurityContext }}
      securityContext:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      containers:
      - name: {{ include "dexgate.fullname" . }}
        args:
          - --config
          - /conf/config.yaml
{{ if .Values.oidc.ca.crt }}
          - --oidcRootCAFile
          - /issuerca/ca.crt
{{ end }}
        image: "{{ .Values.image.repository }}:{{ .Values.image.tag | default .Chart.AppVersion }}"
        imagePullPolicy: {{ .Values.image.pullPolicy }}
        securityContext:
          allowPrivilegeEscalation: false
          capabilities:
            drop:
              - ALL
        env:
          {{ if .Values.oidc.clientID.secret.name }}
          - name: CLIENT_ID
            valueFrom:
              secretKeyRef:
                name: {{ .Values.oidc.clientID.secret.name}}
                key: {{ .Values.oidc.clientID.secret.key }}
          {{ end }}
          {{ if .Values.oidc.clientSecret.secret.name }}
          - name: CLIENT_SECRET
            valueFrom:
              secretKeyRef:
                name: {{ .Values.oidc.clientSecret.secret.name }}
                key: {{ .Values.oidc.clientSecret.secret.key }}
          {{ end }}
        ports:
          - containerPort: 9001
            name: http
            protocol: TCP
        resources:
          {{ toYaml .Values.resources | nindent 10 }}
        volumeMounts:
          - mountPath: /conf
            name: configmap-config
{{ if .Values.oidc.ca.crt }}
          - mountPath: /issuerca
            name: issuer-ca
{{ end }}
      volumes:
      - name: configmap-config
        configMap:
          name: {{ include "dexgate.fullname" . }}-config
          defaultMode: 420
          items:
          - key: config.yaml
            mode: 420
            path: config.yaml
{{ if .Values.oidc.ca.crt }}
      - name: issuer-ca
        secret:
          secretName: {{ include "dexgate.fullname" . }}-oidc-ca
          defaultMode: 420
          items:
            - key: ca.crt
              mode: 420
              path: ca.crt
{{ else if .Values.oidc.ca.secret.name }}
      - name: issuer-ca
        secret:
          secretName: {{ .Values.oidc.ca.secret.name }}
          defaultMode: 420
          items:
            - key: {{ .Values.oidc.ca.secret.key }}
              mode: 420
              path: ca.crt
{{ end }}



