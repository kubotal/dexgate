---
apiVersion: v1
kind: Service
metadata:
  name: {{ include "dexgate.fullname" . }}
  namespace: {{ .Release.Namespace  }}
  labels:
    app: {{ include "dexgate.fullname" . }}
spec:
  type: ClusterIP
  ports:
    - port: 9001
      targetPort: http
      protocol: TCP
  selector:
    app: {{ include "dexgate.fullname" . }}

